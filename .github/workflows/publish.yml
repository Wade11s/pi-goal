# Publishes @wade11s/pi-goal when a v* tag is pushed.
#
# GitHub now issues immutable OIDC subject claims (repo:owner@id/repo@id) for
# this repository, and npm's trusted publishing still matches the legacy shape,
# so the exchange fails with "package not found" (npm/cli#9969). Until that is
# fixed, authentication is a granular NPM_TOKEN secret scoped to this package.
# Provenance is still generated from the OIDC token (id-token: write).
#
# When npm/cli#9969 is fixed: delete the token check and the NODE_AUTH_TOKEN
# env, configure the trusted publisher on npmjs.com, and drop the secret.
#
# The job is re-runnable: a version already on npm is not republished, and an
# existing GitHub release has its notes updated instead of failing.

name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create or update the GitHub release
      id-token: write # OIDC trusted publishing and provenance
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          # Trusted publishing needs npm 11.5.1+; recent Node 24 images already
          # ship it, but pin the floor explicitly rather than assume.
          npm install -g npm@latest
          npm --version

      - name: Check the tag, version, and changelog
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          echo "Publishing $version from tag $GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test against the bundled Pi CLI
        run: npm test
        env:
          PI_BINARY: ${{ github.workspace }}/node_modules/.bin/pi
          # Shared runners are slower and run four test files at once; the default
          # 90s per-step wait occasionally trips on the slowest blockers scenario.
          PI_GOAL_TEST_TIMEOUT_MS: "180000"

      - name: Check the npm publish credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm's trusted publishing still compares the legacy OIDC subject
          # (repo:owner/repo) and rejects this repository's immutable claims
          # (repo:owner@id/repo@id) with "package not found" — npm/cli#9969.
          # A granular token is the supported fallback until that is fixed.
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Trusted publishing is blocked by npm/cli#9969; add a granular @wade11s/pi-goal token as the NPM_TOKEN secret (docs/release.md)."
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          node -e 'console.log({ oidcUrl: Boolean(process.env.ACTIONS_ID_TOKEN_REQUEST_URL), oidcToken: Boolean(process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) })'
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published; skipping npm publish"
          else
            npm publish --provenance --loglevel verbose
          fi

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
