# Temporary diagnostic: print the GitHub OIDC claims that npm's trusted
# publishing exchange compares. Run manually; delete once the publish pipeline
# is proven. No secrets are printed: these claims are standard job metadata.

name: OIDC claims

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print the OIDC claims npm sees
        run: |
          set -euo pipefail
          token="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)"
          node -e '
            const raw = process.argv[1].split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
            const claims = JSON.parse(Buffer.from(raw, "base64").toString("utf8"));
            for (const key of ["sub", "repository", "repository_owner", "repository_id",
              "repository_owner_id", "job_workflow_ref", "workflow_ref", "ref", "environment"]) {
              console.log(`${key}: ${claims[key]}`);
            }
          ' "$token"
